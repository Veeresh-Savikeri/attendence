{%extends "base.html"%}
{%block btn%}
<a class="btn btn-dark" href="http://127.0.0.1:8000/login/">Login</a>
<a class="btn btn-dark" href="http://127.0.0.1:8000/register/">Register</a>
<a class="btn btn-dark" href="http://127.0.0.1:8000/teacher/staff-login/">Staff</a>
{%endblock btn%}

{% block start %}
    <style>
        body {
            background: linear-gradient(to right, #f8fafc, #95b5df);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: linear-gradient(135deg, #040405, #555d66);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-card h2 {
            font-weight: 500;
            color: white;
            margin-bottom: 20px;
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
        }

        .mb-3 {
            text-align: left;
        }

        .btn-login {
            background-color: #1cc88a;
            color: white;
            font-weight: 600;
            border-radius: 30px;
            padding: 12px;
            width: 100%;
            transition: 0.3s;
            border: none;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: #17a673;
            box-shadow: 0 4px 12px rgba(23,166,115,0.4);
        }

        .alert-message {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
        }
    </style>

<div class="login-container">
    <div class="login-card">
    <h2>Staff Login</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <input type="text" name="username" class="form-control" placeholder="Username" required>
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-login">Login</button>
    </form>

    {% for message in messages %}
        <p class="alert-message text-danger">{{ message }}</p>
    {% endfor %}
    </div>
</div>

{% endblock start %}
