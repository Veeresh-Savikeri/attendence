<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>QR Attendance Scanner</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            color: white;
        }

        .scanner-card {
            background: white;
            color: black;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.3);
        }

        #reader {
            width: 100%;
        }

        .person {
            font-size: 28px;
            font-weight: bold;
            color: green;
        }

        .title {
            font-weight: bold;
            margin-bottom: 20px;
        }
    </style>

</head>

<body>

<div class="container h-100 d-flex align-items-center">

    <div class="row w-100">

        <!-- Scanner Section -->
        <div class="col-md-6 mb-4">

            <div class="scanner-card">

                <h3 class="text-center title">📷 Scan Student QR</h3>

                <div id="reader"></div>

            </div>

        </div>

        <!-- Attendance Result -->
        <div class="col-md-6">

            <div class="scanner-card text-center">

                <h3 class="title">Attendance Status</h3>

                <div class="person">Waiting for scan...</div>

            </div>

        </div>

    </div>

</div>


<script>

let session_id = "{{ session_id }}";  // Django session id


function onScanSuccess(decodedText) {

    let student_id = decodedText.split("-")[0];

    fetch("http://127.0.0.1:8000/teacher/mark-attendance/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken")
        },
        body: JSON.stringify({
            student_id: parseInt(student_id),
            session_id: parseInt(session_id)
        })
    })

    .then(response => response.json())

    .then(data => {

        document.querySelector(".person").innerText = data.data;

    });

}


// Start Scanner Automatically
let scanner = new Html5QrcodeScanner(
    "reader",
    { fps: 25, qrbox: 300 }
);

scanner.render(onScanSuccess);


// CSRF Token
function getCookie(name) {

    let cookieValue = null;

    if (document.cookie && document.cookie !== "") {

        let cookies = document.cookie.split(";");

        for (let i = 0; i < cookies.length; i++) {

            let cookie = cookies[i].trim();

            if (cookie.substring(0, name.length + 1) === (name + "=")) {

                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));

                break;

            }
        }
    }

    return cookieValue;
}

</script>

</body>
</html>
