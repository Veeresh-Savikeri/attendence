{% extends "base.html" %}
{%block start%}
<div class="container w-50 my-5 p-4 text-light"
    style="border-radius: 15px; background: linear-gradient(135deg, #2605bb 0%, #ca0303 100%);box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);">
    <form method="POST">
        {% csrf_token %}
        <h2 class="text-center">Create Session</h2>
        <div class="form-group mb-3">
            <label for="exampleInputEmail1">Subject Code</label>
            <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                placeholder="Enter Batch Code" name="batch_code">
        </div>
        <div class="form-group mb-3">
            <label for="exampleInputPassword1">Subject</label>
            <input type="text" class="form-control" id="exampleInputPassword1" placeholder="Subject" name="subject">
        </div>
        <div class="form-grou mb-3">
            <label for="exampleInputEmail1">Branch</label>
            <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name="branch"
                placeholder="Enter Branch">
        </div>
        <div class="form-group mb-3">
            <label for="exampleInputPassword1">Lecturer</label>
            <input type="text" class="form-control" id="exampleInputPassword1" placeholder="Trainer" name="trainer">
        </div>
        <div class="form-group mb-3">
            <label for="exampleInputPassword1">Mode</label>
            <input type="text" class="form-control" id="exampleInputPassword1" placeholder="Mode" name="mode">
        </div>

        <button type="submit" class="btn btn-warning mt-3 ">Create</button>
    </form>
</div>

{% endblock start%}
