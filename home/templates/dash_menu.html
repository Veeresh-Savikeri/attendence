<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
   
    <div class="container-fluid">
      <div class="row">
        <div
          class="col-2 bg-dark m-3 px-5 text-white d-flex flex-column justify-content-evenly text-center"
          style="
            border-radius: 20px;
            height: 95vh;
            position: fixed;
            left: 0;
            top: 0;
            width: 250px;
            overflow-y: auto;
            background: linear-gradient(to top, #6e6868, #000000);
          "
        >
          <h1 class="text-center"><i class="fa-solid fa-user-graduate"></i></h1>
          <a
            href=""
            class="text-decoration-none text-white d-block mb-2 border-bottom border-white"
            >Dashboard</a
          >
          <a
            href=""
            class="text-decoration-none text-white d-block mb-2 border-bottom border-white"
            >Attendance</a
          >
          <a
            href=""
            class="text-decoration-none text-white d-block mb-2 border-bottom border-white"
            >Profile</a
          >
          <a
            href=""
            class="text-decoration-none text-white d-block mb-2 border-bottom border-white"
            >Settings</a
          >
          <a
            href=""
            class="text-decoration-none text-white d-block mb-2 border-bottom border-white"
            >Logout</a
          >
        </div>

        <div style="margin-left: 270px; width: calc(100% - 270px)">
          <div
            class="container-fluid d-flex align-items-center justify-content-between mt-3"
          >
            <div class="input-group rounded w-50">
              <input
                type="search"
                class="form-control border border-dark"
                placeholder="Search"
                aria-label="Search"
                aria-describedby="search-addon"
                style="border-radius: 25px"
              />
            </div>

            <div
              class="card d-flex flex-row align-items-center justify-content-between px-3 py-2 text-white"
              style="min-width: 280px;background: linear-gradient(to left, #948989, #000000);border-radius: 40px"
            >
              <h1 class="w-25"><i class="fa-solid fa-circle-user"></i></h1>
              <div class="w-75 text-start px-3">
                <h5 class="card-title">
                  {% block prof_name %} {% endblock prof_name %}
                </h5>
                <p class="card-text">Student</p>
              </div>
            </div>
          </div>

          <div class="fluid-container w-100">
            {% block content %} {% endblock content%}
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
