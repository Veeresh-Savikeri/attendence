{% extends "base.html" %}
{%block btn%}
<a class="btn btn-dark" href="http://127.0.0.1:8000/login/">Login</a>
<a class="btn btn-dark" href="http://127.0.0.1:8000/register/">Register</a>
<a class="btn btn-dark" href="http://127.0.0.1:8000/teacher/staff-login/">Staff</a>
{%endblock btn%}
{% block start %}
<style>
.gradient-bg {
   background: linear-gradient(to right, #f8fafc, #95b5df);
    padding: 60px 0;
}

.card-registration {
    backdrop-filter: blur(15px);
    background: rgb(0, 0, 0);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
}

.form-control, select {
    background-color:rgba(255, 255, 255, 0.6);
    border: none;
    border-radius: 10px;
    color: black;
}

.form-control:focus, select:focus {
    box-shadow: 0 0 10px #00c6ff;
    background-color: rgba(255, 255, 255, 0.15);
    color: #fff;
}

.form-label {
    color: #ccc;
}

.btn-custom {
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    border: none;
    border-radius: 12px;
    padding: 10px 25px;
    transition: 0.3s ease;
}

.btn-custom:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(0, 114, 255, 0.5);
}
</style>

<section class="gradient-bg">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10 col-xl-8">
                <div class="card card-registration text-light p-5">
                    <h3 class="text-center mb-4">✨ Registration Form</h3>

                    <form method="POST">
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control form-control-lg" name="name" required placeholder="Full Name">
                            </div>

                            <div class="col-md-6 mb-4">
                                <label class="form-label d-block">Gender</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" value="Male" checked>
                                    <label class="form-check-label">Male</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" value="Female">
                                    <label class="form-check-label">Female</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" value="Others">
                                    <label class="form-check-label">Other</label>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control form-control-lg" name="email" required placeholder="Email">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control form-control-lg" name="phoneno" required placeholder="Phone Number">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-4">
                                <label class="form-label">Country</label>
                                <select class="form-control form-control-lg" name="country">
                                    <option>India</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-4">
                                <label class="form-label">State</label>
                                <select class="form-control form-control-lg" name="state">
                                    <option>Karnataka</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-4">
                                <label class="form-label">District</label>
                                <select class="form-control form-control-lg" name="district">
                                    <option>Haveri</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Native Address</label>
                            <input type="text" class="form-control form-control-lg" name="address" placeholder="Native Address">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control form-control-lg" name="password" required placeholder="Create Password">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control form-control-lg" name="repassword" required placeholder="Confirm Password">
                            </div>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-custom btn-lg text-white">
                                Register
                            </button>
                        </div>
                        <div class="text-center mt-4 text-light">
                            <small>Do you have an account? <a href="http://127.0.0.1:8000/login/" class="text-info">Login</a></small>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
